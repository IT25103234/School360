# Server configuration
server.port=${PORT:8080}
spring.application.name=school360

# Database Configuration (existing MySQL database)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school360_db}
spring.datasource.username=${DB_USERNAME:school360}
spring.datasource.password=${DB_PASSWORD:school@360}
# Spring Boot detects the JDBC driver from DB_URL (H2 or MySQL).

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Spring Data JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Hibernate detects the dialect from the connected database.

# H2 Web Console Configuration
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Allow SQL initialization schema/data scripts to execute
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
